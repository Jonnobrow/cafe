---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      server:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: immich
          configmap.reloader.stakater.com/reload: immich
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.1@sha256:3c54d39f19fdb82ed5b3f286450e4071133cc6025bd0e25856bc2c522f8fc030
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: immich
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v2.7.4@sha256:040b2fed8f7f6b7405f9b4b26348b4656355e4d4ed0852b8e966d453dd6635cc
            envFrom:
              - secretRef:
                  name: immich
              - configMapRef:
                  name: immich
      machine-learning:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: immich
          configmap.reloader.stakater.com/reload: immich
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v2.7.4@sha256:e25a410b99567c369da14508c7e874dfbeee1bcf06adda2c4148ab2f32f9463d
            envFrom:
              - secretRef:
                  name: immich
              - configMapRef:
                  name: immich
            env:
              MPLCONFIGDIR: "/cache/matplotlib"
      redis:
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 8.6.2@sha256:1f073813b641755b70b0200da64131bbeeb4ec5b633ca67772229b49820caafa
            env:
              REDIS_REPLICATION_MODE: master
            command: ["redis-server"]

      public-proxy:
        containers:
          main:
            image:
              repository: alangrainger/immich-public-proxy
              tag: 2.2.1
              pullPolicy: IfNotPresent
            env:
              IMMICH_URL: http://immich-server.default.svc.cluster.local:2283
              CONFIG: |
                {
                  "ipp": {
                    "responseHeaders": {
                      "Cache-Control": "public, max-age=2592000",
                      "Access-Control-Allow-Origin":  "*"
                    },
                    "singleImageGallery": false,
                    "singleItemAutoOpen": true,
                    "downloadOriginalPhoto": true,
                    "downloadedFilename": 0,
                    "allowDownloadAll": 1,
                    "allowSlugLinks": true,
                    "showHomePage": true,
                    "showGalleryTitle": true,
                    "showMetadata": {
                      "description": false
                    },
                    "customInvalidResponse": false
                  },
                  "lightGallery": {
                    "controls": true,
                    "download": true,
                    "customSlideName": true,
                    "mobileSettings": {
                      "controls": false,
                      "showCloseIcon": true,
                      "download": true
                    }
                  }
                }

    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
      redis:
        controller: redis
        ports:
          http:
            port: 6379
      public-proxy:
        controller: public-proxy
        ports:
          http:
            port: &proxy-port 3000

    route:
      internal:
        hostnames: ["photos.${CLUSTER_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *port

      proxy:
        hostnames: ["img.${CLUSTER_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: public-proxy
                port: *proxy-port
            matches:
              - path:
                  type: PathPrefix
                  value: /share/
              - path:
                  type: PathPrefix
                  value: /s/

    persistence:
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib
      library:
        existingClaim: immich-nfs
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/upload
      machine-learning-cache:
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache
      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
