---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      server:
        strategy: RollingUpdate
        labels:
          postgres: "true"
        annotations:
          secret.reloader.stakater.com/reload: immich
          configmap.reloader.stakater.com/reload: immich
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: immich
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
            envFrom:
              - secretRef:
                  name: immich
              - configMapRef:
                  name: immich
      machine-learning:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: immich
          configmap.reloader.stakater.com/reload: immich
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
            envFrom:
              - secretRef:
                  name: immich
              - configMapRef:
                  name: immich
            env:
              MPLCONFIGDIR: "/cache/matplotlib"
      redis:
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
            env:
              REDIS_REPLICATION_MODE: master
            command: ["redis-server"]

      public-proxy:
        containers:
          main:
            image:
              repository: alangrainger/immich-public-proxy
              tag: 3.2.0
              pullPolicy: IfNotPresent
            env:
              IMMICH_URL: http://immich-server.default.svc.cluster.local:2283
              CONFIG: |
                {
                  "ipp": {
                    "responseHeaders": {
                      "Cache-Control": "public, max-age=2592000",
                      "Access-Control-Allow-Origin":  "*"
                    },
                    "gallery": {
                      "singleImage": false,
                      "singleItemAutoOpen": true,
                      "showTitle": true,
                      "showDescription": true,
                      "groupByDate": false
                    },
                    "maxDownloadQuality": "original",
                    "downloadedFilename": 0,
                    "allowDownload": 1,
                    "allowSlugLinks": true,
                    "showHomePage": true,
                    "showMetadata": {
                      "description": {
                        "caption": false,
                        "sidebar": false
                      }
                    },
                    "customInvalidResponse": false
                  },
                  "lightbox": {
                    "showArrows": true,
                    "showDownload": true,
                    "mobileArrows": false
                  }
                }
    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
      redis:
        controller: redis
        ports:
          http:
            port: 6379
      public-proxy:
        controller: public-proxy
        ports:
          http:
            port: &proxy-port 3000

    route:
      internal:
        hostnames: ["photos.${CLUSTER_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *port

      proxy:
        hostnames: ["img.${CLUSTER_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: public-proxy
                port: *proxy-port
            matches:
              - path:
                  type: PathPrefix
                  value: /share/
              - path:
                  type: PathPrefix
                  value: /s/

    persistence:
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib
      library:
        existingClaim: immich-nfs
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/upload
      machine-learning-cache:
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache
      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
