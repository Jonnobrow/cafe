---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system # Required for Renovate lookups
spec:
  interval: 1h
  url: https://helm.cilium.io
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: 1.18.6
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
    # NOTE: operator.tolerations removed to fix Cilium 1.18.x Helm template bug (issue #40937)
    # Previously: tolerations: []
    #
    # FUTURE CONSIDERATIONS:
    # 1. Node Draining: If operator pods stick to drained nodes during maintenance, add specific tolerations:
    #    tolerations:
    #      - key: "node-role.kubernetes.io/control-plane"
    #        operator: "Exists"
    #        effect: "NoSchedule"
    #
    # 2. BGP Control Plane: If enabling BGP in the future and experiencing bootstrap issues,
    #    may need to revert to empty array: tolerations: []
    #    See: https://github.com/cilium/cilium/issues/29371
